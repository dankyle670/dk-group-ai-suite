    <!-- JSON-LD — Organisation -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "DK Group",
      "url": "https://dkgroupdigital.fr",
      "logo": "https://dkgroupdigital.fr/favicon.svg",
      "description": "Agence IA & digitale basée à Paris. Nous déployons des flottes d'agents IA (sales, marketing, support, ops) qui travaillent ensemble 24/7 pour les dirigeants qui veulent déléguer et scaler leurs opérations.",
      "email": "danielkomoe78@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Paris",
        "addressCountry": "FR"
      },
      "areaServed": ["FR", "BE", "CH", "CA"],
      "knowsLanguage": ["fr", "en"],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Services DK Group",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Flotte d'agents IA",
              "description": "Déployez plusieurs agents IA spécialisés (sales, marketing, support, ops) qui collaborent en temps réel pour automatiser vos opérations de bout en bout."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Agent IA Sales",
              "description": "Prospection automatisée, qualification de leads, relances et mises à jour CRM en continu."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Agent IA Support",
              "description": "Support client 24/7 sur tous les canaux avec réponses instantanées et routage intelligent."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Agent IA Marketing",
              "description": "Génération de contenu, optimisation des campagnes et automatisation social media."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Développement web & mobile",
              "description": "Applications web et mobiles sur mesure avec React, Next.js, React Native et Flutter."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Solutions data",
              "description": "Data engineering, dashboards analytics et pipelines ETL pour exploiter vos données."
            }
          }
        ]
      }
    }
    </script>

    <!-- JSON-LD — WebSite (SearchAction pour le sitelinks searchbox) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "DK Group",
      "url": "https://dkgroupdigital.fr",
      "inLanguage": ["fr", "en"],
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://dkgroupdigital.fr/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=dkgroup1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=dkgroup1" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=dkgroup1" />
  </head>
  <body>
    <!-- Netlify Forms (hidden form to enable form detection in SPA builds) -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="hidden" name="subject" data-remove-prefix value="New lead from %{formName} (%{submissionId})" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="topic" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

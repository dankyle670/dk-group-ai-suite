<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DK Group - AI-Powered Digital Solutions</title>
    <meta name="description" content="DK Group builds AI agents, automation systems, and digital solutions that scale your business. Your long-term technology partner." />
    <meta name="author" content="DK Group" />
    <meta property="og:title" content="DK Group - AI-Powered Digital Solutions" />
    <meta property="og:description" content="We build AI agents and intelligent systems that drive measurable business growth." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=dkgroup1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=dkgroup1" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=dkgroup1" />
  </head>
  <body>
    <!-- Netlify Forms (hidden form to enable form detection in SPA builds) -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="hidden" name="subject" data-remove-prefix value="New lead from %{formName} (%{submissionId})" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="topic" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
